name: One Click Deploy (Dev)

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials via OIDC (FIXED)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::260476742932:role/github-dev-deploy
          aws-region: us-east-1

      # 3. Verify AWS identity (debug & safety)
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 4. Terraform Init
      - name: Terraform Init
        run: |
          cd infra
          terraform init

      # 5. Select or create dev workspace
      - name: Terraform Workspace
        run: |
          cd infra
          terraform workspace select dev || terraform workspace new dev

      # 6. Terraform Apply (THIS CREATES RESOURCES)
      - name: Terraform Apply (Dev)
        run: |
          cd infra
          terraform apply -auto-approve
